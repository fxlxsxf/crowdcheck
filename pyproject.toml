[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdcheck"
version = "0.1.0"
description = "Audit the crowd holding a Solana token, not the contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
crowdcheck = "crowdcheck.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crowdcheck = ["render/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
